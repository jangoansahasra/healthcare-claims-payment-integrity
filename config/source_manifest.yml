manifest_version: 1
last_reviewed: "2026-07-29"

project_data_policy:
  maximum_source_lag_years: 3
  allow_restricted_data: false
  allow_identifiable_beneficiary_data: false
  allow_proprietary_cpt_descriptions: false
  commit_complete_raw_files: false
  commit_complete_processed_files: false
  publish_synthetic_samples_only: true
  require_sha256_checksum: true
  require_source_documentation: true

sources:
  - source_id: cms_physician_provider_service
    name: Medicare Physician and Other Practitioners by Provider and Service
    catalog_title: Medicare Physician & Other Practitioners - by Provider and Service
    publisher: Centers for Medicare & Medicaid Services
    role: observed
    domain: professional_medical
    grain: provider_npi_hcpcs_place_of_service_year
    source_page: https://data.cms.gov/provider-summary-by-type-of-service/medicare-physician-other-practitioners/medicare-physician-other-practitioners-by-provider-and-service/
    api_docs: https://data.cms.gov/provider-summary-by-type-of-service/medicare-physician-other-practitioners/medicare-physician-other-practitioners-by-provider-and-service/api-docs
    download_method: cms_data_api_catalog
    requested_years:
      - 2019
      - 2020
      - 2021
      - 2022
      - 2023
      - 2024
    latest_verified_year: 2024
    local_directory: data/raw/cms/physician_provider_service
    ingestion_status: planned
    contains_real_healthcare_activity: true
    contains_direct_beneficiary_identifiers: false
    commit_raw_file: false
    planned_uses:
      - Professional service utilization
      - Submitted versus allowed amount analysis
      - Medicare payment analysis
      - HCPCS and provider concentration
      - Provider peer benchmarking
      - Synthetic claim calibration
    limitations:
      - Represents Original Medicare fee-for-service activity.
      - Does not represent a provider's entire practice.
      - Privacy suppression affects low-volume records.
      - Service counts have HCPCS-specific unit interpretations.
      - Facility-setting professional payments may exclude facility payments.

