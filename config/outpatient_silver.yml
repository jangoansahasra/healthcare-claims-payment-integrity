contract_version: 1
last_reviewed: "2026-07-31"

model:
  name: cms_outpatient_provider_service_silver
  source_id: cms_outpatient_provider_service
  source_layer: bronze
  target_layer: silver
  data_role: observed_benchmark
  grain: one row per hospital CCN, comprehensive APC, and published reporting period

governance:
  source_authority: Centers for Medicare & Medicaid Services
  official_dataset: https://data.cms.gov/provider-summary-by-type-of-service/medicare-outpatient-hospitals/medicare-outpatient-hospitals-by-provider-and-service
  official_data_dictionary: https://data.cms.gov/sites/default/files/2020-12/Medicare%20Outpatient%20Hospitals%20-%20by%20Provider%20and%20Service%20Data%20Dictionary.pdf
  official_methodology: https://data.cms.gov/sites/default/files/2024-06/54319dec-5705-40ce-b9a6-fd88043ef8ac/MUP_OUT_RY24_20240531_Methodology-508.pdf
  contains_real_provider_identifiers: true
  contains_beneficiary_identifiers: false
  population: Original Medicare fee-for-service Part B beneficiaries at OPPS hospitals
  permitted_uses:
    - hospital and comprehensive APC utilization benchmarking
    - submitted-charge, allowed-amount, and payment benchmarking
    - available-period outpatient comparison
    - synthetic outpatient claims calibration
    - data-quality and reconciliation testing
  prohibited_uses:
    - attributing injected anomalies to real hospitals
    - presenting a benchmark outlier as fraud or incorrect payment
    - representing provider-APC summaries as claim-level transactions
    - presenting available periods as a complete annual time series
    - treating submitted charges as contractual payment ceilings
    - reconstructing suppressed source values

paths:
  bronze_glob: data/processed/cms/cms_outpatient_provider_service/*/*.parquet
  silver_output: data/interim/silver/cms_outpatient_provider_service.parquet
  quality_report: data/metadata/quality/cms_outpatient_provider_service_silver.json

business_key:
  - hospital_ccn
  - comprehensive_apc_code
  - reporting_period

source_dimensions:
  Rndrng_Prvdr_CCN: hospital_ccn
  Rndrng_Prvdr_Org_Name: hospital_name
  Rndrng_Prvdr_St: hospital_street_address
  Rndrng_Prvdr_City: hospital_city
  Rndrng_Prvdr_State_Abrvtn: hospital_state_abbreviation
  Rndrng_Prvdr_State_FIPS: hospital_state_fips
  Rndrng_Prvdr_Zip5: hospital_zip5
  Rndrng_Prvdr_RUCA: hospital_ruca_code
  Rndrng_Prvdr_RUCA_Desc: hospital_ruca_description
  APC_Cd: comprehensive_apc_code
  APC_Desc: comprehensive_apc_description

retained_lineage:
  - _source_id
  - _reporting_year
  - _source_file
  - _acquired_at_utc

source_schema:
  expected_cms_column_count: 18
  expected_lineage_column_count: 4
  required_columns:
    - Rndrng_Prvdr_CCN
    - APC_Cd
    - Bene_Cnt
    - CAPC_Srvcs
    - Avg_Tot_Sbmtd_Chrgs
    - Avg_Mdcr_Alowd_Amt
    - Avg_Mdcr_Pymt_Amt
    - Outlier_Srvcs
    - Avg_Mdcr_Outlier_Amt

available_period_policy:
  published_periods:
    - 2019
    - 2021
    - 2023
  unavailable_periods:
    - 2020
    - 2022
    - 2024
  describe_as_complete_annual_series: false
  interpolate_unavailable_periods: false
  treat_unavailable_periods_as_zero: false

historical_attribute_handling:
  hospital_attributes_are_period_specific: true
  preserve_reported_values_by_period: true
  do_not_overwrite_history_with_latest_values: true
  observed_hospitals_with_changes:
    hospital_name: 518
    hospital_state_abbreviation: 0
    hospital_zip5: 60
    hospital_ruca_code: 124

apc_description_handling:
  descriptions_are_period_specific: true
  preserve_reported_description_by_period: true
  do_not_overwrite_history_with_latest_description: true
  observed_codes_with_description_changes: 0

nullable_dimension_policy:
  hospital_ruca_code:
    observed_null_or_blank_rows: 18
    silver_value_when_missing: Unknown
    preserve_missing_indicator: true
  hospital_ruca_description:
    observed_null_or_blank_rows: 18
    silver_value_when_missing: Unknown
    preserve_missing_indicator: true
  hospital_name:
    nullable: false
  hospital_state_fips:
    nullable: false
  hospital_zip5:
    nullable: false
  comprehensive_apc_description:
    nullable: false

numeric_typing:
  use_try_cast: true
  integer_type: BIGINT
  decimal_type: DECIMAL(38, 6)
  integer_columns:
    - Bene_Cnt
    - CAPC_Srvcs
    - Outlier_Srvcs
  decimal_columns:
    - Avg_Tot_Sbmtd_Chrgs
    - Avg_Mdcr_Alowd_Amt
    - Avg_Mdcr_Pymt_Amt
    - Avg_Mdcr_Outlier_Amt
  preserve_nulls: true
  prohibit_zero_imputation: true

suppression_semantics:
  publication_minimum: 11
  provider_apc_summary:
    governing_measure: CAPC_Srvcs
    suppressed_when: 10 or fewer comprehensive APC services
    governed_columns:
      - CAPC_Srvcs
      - Avg_Tot_Sbmtd_Chrgs
      - Avg_Mdcr_Alowd_Amt
      - Avg_Mdcr_Pymt_Amt
    observed_suppressed_rows: 157739
  beneficiary_count:
    governing_measure: Bene_Cnt
    suppressed_when: 10 or fewer beneficiaries
    observed_additional_suppressed_rows: 3350
  outlier_detail:
    governing_measure: Outlier_Srvcs
    suppressed_when: 10 or fewer outlier services
    governed_columns:
      - Outlier_Srvcs
      - Avg_Mdcr_Outlier_Amt
    observed_suppressed_rows: 211218
  absence_is_not_zero: true
  prohibit_reconstruction: true
  create_explicit_status_columns: true

payment_semantics:
  average_submitted_charge:
    source_column: Avg_Tot_Sbmtd_Chrgs
    meaning: average estimated amount billed to Medicare for covered APC services
  average_medicare_allowed_amount:
    source_column: Avg_Mdcr_Alowd_Amt
    meaning: average regular payment including Medicare, beneficiary cost sharing, and third-party coordination-of-benefits amounts, excluding outlier payments
  average_medicare_payment:
    source_column: Avg_Mdcr_Pymt_Amt
    meaning: average regular amount Medicare pays directly to the provider, excluding outlier payments
  average_medicare_outlier_amount:
    source_column: Avg_Mdcr_Outlier_Amt
    meaning: average outlier payment Medicare pays directly to the provider
  require_medicare_payment_not_above_allowed_amount: true
  require_nonnegative_values: true
  do_not_require_allowed_amount_below_submitted_charge: true
  do_not_require_outlier_amount_below_regular_payment: true
  observed_allowed_above_submitted_charge_rows: 85
  observed_payment_above_submitted_charge_rows: 49
  observed_outlier_above_regular_payment_rows: 3082

allowed_values:
  reporting_periods:
    - 2019
    - 2021
    - 2023
  ccn_pattern: "^[0-9A-Za-z]{6}$"
  comprehensive_apc_pattern: "^[0-9]{4}$"
  state_fips_pattern: "^[0-9]{2}$"
  zip5_pattern: "^[0-9]{5}$"

service_volume_bands:
  measure: comprehensive_apc_services
  derivation: pooled published-period empirical quartile cut points among non-suppressed values
  bands:
    - name: low
      minimum_inclusive: 11
      maximum_inclusive: 20
    - name: medium
      minimum_inclusive: 21
      maximum_inclusive: 38
    - name: high
      minimum_inclusive: 39
      maximum_inclusive: 88
    - name: very_high
      minimum_inclusive: 89
      maximum_inclusive: null
  value_when_suppressed: suppressed

benchmark_cohorts:
  purpose: compare similar observed outpatient hospital and comprehensive APC activity
  dimensions:
    - comprehensive_apc_code
    - hospital_state_fips
    - hospital_ruca_code
    - service_volume_band
    - reporting_period
  minimum_peer_group_size: 11
  comparison_statistics:
    - hospital_count
    - service_count
    - median
    - mean
    - standard_deviation
    - percentile_25
    - percentile_75
    - percentile_90
    - percentile_95
  prohibit_outlier_as_fraud_label: true

privacy_and_reporting:
  hospital_ccn_is_public_identifier: true
  minimum_public_peer_group_size: 11
  expose_real_hospital_anomaly_flags: false
  label_real_hospital_results_as_benchmarks: true
  prohibit_hospital_fraud_labels: true
  public_dashboard_excluded_fields:
    - hospital_name
    - hospital_street_address
    - hospital_zip5

quality_rules:
  preserve_source_row_count: true
  require_unique_business_key: true
  require_non_null_business_key: true
  require_valid_ccn: true
  require_valid_comprehensive_apc_code: true
  require_valid_state_fips: true
  require_valid_zip5: true
  retain_all_published_periods: true
  prohibit_unavailable_period_interpolation: true
  require_canonical_source_schema: true
  reject_unparseable_numeric_values: true
  require_integral_count_values: true
  require_nonnegative_count_values: true
  require_nonnegative_financial_values: true
  preserve_numeric_nulls: true
  require_suppression_pattern_reconciliation: true
  prohibit_suppressed_value_reconstruction: true
  require_medicare_payment_not_above_allowed_amount: true
  report_allowed_above_submitted_charge: true
  report_payment_above_submitted_charge: true
  report_outlier_above_regular_payment: true
  require_nullable_dimension_policy: true
  require_period_specific_hospital_attributes: true
  require_period_specific_apc_descriptions: true
  require_peer_group_threshold_configuration: true
  prohibit_real_hospital_anomaly_attribution: true
