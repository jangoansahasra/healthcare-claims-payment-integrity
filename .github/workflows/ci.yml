name: Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Build ignored integration fixtures
        run: |
          python -m src.synthetic.build_synthetic_dimensions \
            --output-root "${{ runner.temp }}/synthetic" \
            --sample-root "${{ runner.temp }}/samples" \
            --quality-report "${{ runner.temp }}/dimensions.json"
          python -m src.synthetic.build_synthetic_claims \
            --dimension-root "${{ runner.temp }}/synthetic" \
            --output-root "${{ runner.temp }}/synthetic" \
            --sample-root "${{ runner.temp }}/samples" \
            --quality-report "${{ runner.temp }}/claims.json"
          python -m src.synthetic.build_synthetic_workflow \
            --data-root "${{ runner.temp }}/synthetic" \
            --sample-root "${{ runner.temp }}/samples" \
            --quality-report "${{ runner.temp }}/workflow.json"
          python -m src.synthetic.build_procedure_clinical_anomalies \
            --baseline-root "${{ runner.temp }}/synthetic" \
            --output-root "${{ runner.temp }}/synthetic-anomalous" \
            --sample-root "${{ runner.temp }}/samples" \
            --quality-report "${{ runner.temp }}/anomalies.json"
          python -m src.transformation.build_trusted_claims \
            --source-root "${{ runner.temp }}/synthetic-anomalous" \
            --output-root "${{ runner.temp }}/trusted-claims" \
            --sample-root "${{ runner.temp }}/samples" \
            --quality-report "${{ runner.temp }}/trusted.json"

      - name: Run tests
        env:
          TRUSTED_CLAIMS_TEST_ROOT: ${{ runner.temp }}/trusted-claims
        run: python -m pytest
